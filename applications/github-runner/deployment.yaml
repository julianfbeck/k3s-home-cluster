apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: github-actions
  labels:
    app: github-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
      annotations:
        # Belt-and-braces: descheduler's policy already excludes the
        # github-actions namespace, but this annotation tells the
        # DefaultEvictor to skip this pod even if the policy changes.
        # A running job would be killed mid-step if the pod is evicted.
        descheduler.alpha.kubernetes.io/evict: "false"
    spec:
      restartPolicy: Always
      containers:
        - name: runner
          image: myoung34/github-runner:latest
          imagePullPolicy: Always
          env:
            - name: RUNNER_NAME
              value: k8s
            - name: RUNNER_SCOPE
              value: org
            - name: ORG_NAME
              value: Bejuforge
            - name: LABELS
              value: k8s,arm64,linux
            - name: RUNNER_WORKDIR
              value: /runner/_work
            - name: EPHEMERAL
              value: "false"
            - name: DISABLE_AUTO_UPDATE
              value: "true"
            # RUNNER_TOKEN is an org registration token, used directly.
            #
            # This replaced ACCESS_TOKEN, a classic PAT with `admin:org`, which
            # had expired: the image was calling the GitHub API on every start to
            # mint a registration token, getting 401, and dying — 10741 restarts
            # by the time it was noticed.
            #
            # ACCESS_TOKEN must stay REMOVED, not merely unset alongside this: the
            # entrypoint prefers it when present and would overwrite RUNNER_TOKEN
            # with whatever it managed to mint.
            #
            # Caveat, and the reason the PAT was the better design: a registration
            # token is single-use and expires in about an hour, and this runner
            # deregisters itself on shutdown (`Caught EXIT - Deregistering
            # runner`), so it needs to register again on every start. This will
            # therefore run until the next pod restart and then fail. Restoring a
            # valid `admin:org` PAT as ACCESS_TOKEN brings back the self-healing
            # behaviour.
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-secrets
                  key: RUNNER_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          volumeMounts:
            - name: state
              mountPath: /runner
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: runner-state
